<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Warna dan Angka</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{font-family:"Fredoka","Comic Sans MS","Trebuchet MS",sans-serif;background:linear-gradient(160deg,#8fd3ff,#ffe7a3 55%,#ffb3d9);color:#3b2a6b;display:flex;flex-direction:column;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.screen{display:none;width:100%;max-width:640px;text-align:center;flex-direction:column;align-items:center;gap:18px;animation:pop .5s ease}
.screen.on{display:flex}
h1{font-size:clamp(2rem,8vw,3.2rem);margin:0;text-shadow:0 3px 0 #fff}
h2{font-size:clamp(1.5rem,6vw,2.2rem);margin:0}
.mascot{font-size:clamp(4rem,18vw,7rem);animation:bob 2s ease-in-out infinite}
.btn{font:inherit;font-size:clamp(1.4rem,6vw,2rem);font-weight:700;color:#fff;border:0;border-radius:28px;padding:18px 32px;min-width:240px;min-height:84px;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-4px) scale(1.04)}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.b1{background:#ff5c8a}.b2{background:#2ec4b6}.b3{background:#ffa62b}
.top{display:flex;justify-content:space-between;width:100%;font-size:1.5rem;font-weight:700}
.q{background:#fff;border-radius:28px;padding:18px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.12);font-size:clamp(1.4rem,6vw,2rem);font-weight:700}
.items{font-size:clamp(2rem,9vw,3.2rem);line-height:1.3;margin-top:8px;word-break:break-all}
.items span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.opts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%}
.opt{width:clamp(96px,28vw,150px);height:clamp(96px,28vw,150px);border-radius:50%;border:6px solid #fff;font:inherit;font-size:clamp(2.6rem,12vw,4.5rem);font-weight:700;color:#3b2a6b;background:#fff;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .15s}
.opt:hover{transform:scale(1.1) rotate(-4deg)}
.opt.ok{animation:win .6s ease forwards}
.opt.no{animation:shake .45s}
#msg{min-height:2.2rem;font-size:1.6rem;font-weight:700}
.bar{height:16px;width:100%;background:#fff8;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2ec4b6;border-radius:10px;transition:width .4s}
.stars{font-size:clamp(2.6rem,12vw,4.5rem)}
footer{text-align:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fffc;font-weight:700;font-size:.95rem}
.fx{position:fixed;top:-60px;font-size:2rem;pointer-events:none;z-index:9;animation:fall 1.6s linear forwards}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@keyframes win{50%{transform:scale(1.3) rotate(8deg)}to{transform:scale(1.1);background:#b8f5c4;border-color:#2ec46b}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<main>
 <section id="menu" class="screen on">
  <div class="mascot">🐥</div>
  <h1>Belajar Warna dan Angka</h1>
  <button class="btn b1" data-mode="warna">🎨 Belajar Warna</button>
  <button class="btn b2" data-mode="angka">🔢 Belajar Angka</button>
 </section>
 <section id="play" class="screen">
  <div class="top"><span id="sc">⭐ 0</span><span id="rd">1/10</span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="q"><div id="qt"></div><div id="qi" class="items"></div></div>
  <div id="opts" class="opts"></div>
  <div id="msg"></div>
  <button class="btn b3" style="min-height:60px;font-size:1.2rem" id="home">🏠 Menu</button>
 </section>
 <section id="end" class="screen">
  <div class="mascot">🏆</div>
  <h2 id="et"></h2>
  <div id="es" class="stars"></div>
  <button class="btn b1" id="again">🔁 Main Lagi</button>
  <button class="btn b3" id="home2">🏠 Menu</button>
 </section>
</main>
<footer>Game Edukasi by MC Berkah Ilahi 09</footer>
<script>
(function(){
"use strict";
var COLORS=[["Merah","#ff3b3b"],["Biru","#2f80ff"],["Kuning","#ffd60a"],["Hijau","#2ec45a"],["Oranye","#ff8a00"],["Ungu","#9b5de5"],["Pink","#ff6fb5"]];
var ICONS=["🍎","🐟","⭐","🎈","🐱","🌸","🚗","🍓"];
var PRAISE=["Hebat! 🎉","Pintar sekali! 🌟","Benar! 👏","Keren! 🥳","Yeay! 🎊"];
var mode="warna",score=0,round=0,TOTAL=10,lock=false,timer=null,answer=null;
var $=function(id){return document.getElementById(id)};
function show(id){["menu","play","end"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function confetti(){var E=["🎉","⭐","🎈","✨","🌈"];for(var i=0;i<18;i++){var s=document.createElement("div");s.className="fx";s.textContent=E[i%E.length];s.style.left=Math.random()*95+"vw";s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(function(n){n.remove()},2300,s)}}
function start(m){mode=m;score=0;round=0;show("play");next()}
function next(){
 clearTimeout(timer);
 if(round>=TOTAL){return finish()}
 lock=false;round++;$("msg").textContent="";
 $("sc").textContent="⭐ "+score;$("rd").textContent=round+"/"+TOTAL;
 $("pb").style.width=((round-1)/TOTAL*100)+"%";
 var o=$("opts");o.innerHTML="";var choices;
 if(mode==="warna"){
  var c=shuffle(COLORS).slice(0,3);answer=c[0][0];choices=shuffle(c);
  $("qt").textContent="Mana warna "+answer.toUpperCase()+"?";$("qi").textContent="🎨";
  speak("Mana warna "+answer+"?");
  choices.forEach(function(x){add(x[0],"",x[1])});
 }else{
  var n=Math.floor(Math.random()*10)+1,ic=ICONS[Math.floor(Math.random()*ICONS.length)],set={};
  answer=String(n);set[n]=1;
  while(Object.keys(set).length<3){set[Math.floor(Math.random()*10)+1]=1}
  $("qt").textContent="Ada berapa "+ic+" ?";
  $("qi").innerHTML="";
  for(var i=0;i<n;i++){var sp=document.createElement("span");sp.textContent=ic;sp.style.animationDelay=(i*.12)+"s";$("qi").appendChild(sp)}
  speak("Ada berapa?");
  shuffle(Object.keys(set)).forEach(function(k){add(k,k,"")});
 }
}
function add(val,label,bg){
 var b=document.createElement("button");b.className="opt";b.textContent=label;
 b.setAttribute("aria-label",val);
 if(bg){b.style.background=bg}
 b.addEventListener("click",function(){pick(b,val)});
 $("opts").appendChild(b);
}
function pick(b,val){
 if(lock)return;
 if(val===answer){
  lock=true;score++;b.classList.add("ok");confetti();
  var p=PRAISE[Math.floor(Math.random()*PRAISE.length)];$("msg").textContent=p;
  $("sc").textContent="⭐ "+score;speak(p.replace(/[^\w\s!]/g,""));
  timer=setTimeout(next,1500);
 }else{
  b.classList.remove("no");void b.offsetWidth;b.classList.add("no");
  $("msg").textContent="Coba lagi ya! 💪";speak("Coba lagi ya");
 }
}
function finish(){
 $("pb").style.width="100%";show("end");
 var st=score>=9?3:score>=6?2:1;
 $("es").textContent="⭐".repeat(st)+"☆".repeat(3-st);
 $("et").textContent="Skor kamu "+score+" dari "+TOTAL+"!";
 confetti();speak("Hebat! Skor kamu "+score);
}
function menu(){clearTimeout(timer);try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}show("menu")}
document.querySelectorAll("[data-mode]").forEach(function(b){b.addEventListener("click",function(){start(b.dataset.mode)})});
$("home").addEventListener("click",menu);
$("home2").addEventListener("click",menu);
$("again").addEventListener("click",function(){start(mode)});
})();
</script>
</body>
</html>
